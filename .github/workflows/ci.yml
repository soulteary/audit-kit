name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


jobs:
  # Code formatting check
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  # Code static analysis
  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run go vet
        run: go vet ./...

  # Code testing
  test:
    name: Code Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.html

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Code quality check (using golangci-lint)
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          only-new-issues: false

  # The root package must keep depending on nothing but the standard library
  # and secure-kit: no database driver, no Redis client. That is what v2 bought,
  # and it is one blank import away from being undone.
  root-package-deps:
    name: Root Package Dependency Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Root package must not link a driver or a Redis client
        run: |
          set -euo pipefail
          deps="$(go list -deps . | grep '\.' || true)"
          echo "Non-stdlib packages linked by the root package:"
          echo "$deps"

          forbidden='github.com/redis/|github.com/lib/pq|github.com/go-sql-driver/|modernc.org/sqlite|github.com/mattn/go-sqlite3|github.com/jackc/'
          if echo "$deps" | grep -Eq "$forbidden"; then
            echo "::error::the root package links a driver or a Redis client again."
            echo "Backends that need a third-party client belong in a subpackage"
            echo "(see redisstore), and database/sql drivers are the program's to"
            echo "register. A blank import here undoes the v2 split for every user."
            exit 1
          fi

  # Dependency security scan
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security scan
        run: govulncheck ./...
